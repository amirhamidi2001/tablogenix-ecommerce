services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: backend_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Django Channels layer) ───────────────────────────────────────────
  redis:
    image: redis:7
    container_name: backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django backend (Daphne ASGI — serves HTTP + WebSocket) ─────────────────
  backend:
    build:
      context: ./backend
      target: development # swap to "production" for prod deployments
    container_name: backend
    restart: unless-stopped
    # Development: Django dev server (auto-reload on file changes)
    # Production:  remove the command override — Dockerfile CMD uses Daphne
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: "dev-secret-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      # Database
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      # Redis (Django Channels)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React / Vite frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep container's node_modules isolated
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000 # WebSocket base URL for chat
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  static_volume:
  media_volume:
