[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --strict-markers
    -v
    --tb=short
markers =
    unit: Pure unit tests — no DB, no network
    integration: Tests that hit the DB or real serializers
    api: Tests that use DRF APIClient against live URLs
