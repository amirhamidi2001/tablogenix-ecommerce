[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --reuse-db
    --strict-markers
    -v
    --tb=short

markers =
    unit: Unit tests (no DB, no network)
    integration: Integration tests (DB required)
    websocket: WebSocket / Channels consumer tests
