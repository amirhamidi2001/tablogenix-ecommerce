# ─── .github/workflows/ci.yml ─────────────────────────────────────────────────
# CI/CD pipeline for the Django + React project.
#
# Jobs:
#   backend  — pytest with real PostgreSQL + Redis services
#   frontend — vitest
#   docker   — build both images (validates Dockerfiles)
#   deploy   — SSH into server, pull, restart prod stack (main branch only)

name: CI / CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ─── Backend: pytest ────────────────────────────────────────────────────────
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    env:
      # Point at the test services above
      DJANGO_SETTINGS_MODULE: core.settings.development
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_NAME: test_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      FRONTEND_URL: "http://localhost:3000"
      ADMIN_URL: "admin/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: |
          pytest \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ─── Frontend: vitest ───────────────────────────────────────────────────────
  frontend:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Run tests with coverage
        run: npx vitest run --coverage
        continue-on-error: true   # Don't fail the pipeline on coverage gaps

  # ─── Docker: build images ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only build if tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (production stage)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # collectstatic inside the Dockerfile needs these build args
          build-args: |
            DJANGO_SETTINGS_MODULE=core.settings.production
            SECRET_KEY=build-time-placeholder
            DATABASE_NAME=placeholder
            DATABASE_USER=placeholder
            DATABASE_PASSWORD=placeholder
            DATABASE_HOST=placeholder
            DATABASE_PORT=5432

      - name: Build frontend image (nginx stage)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy: SSH into server (main branch only) ─────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    # Only deploy when code is pushed to main — not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Building and restarting production stack..."
            docker compose -f docker-compose.prod.yml pull --quiet || true
            docker compose -f docker-compose.prod.yml up --build -d

            echo "→ Running migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend \
              python manage.py migrate --noinput

            echo "→ Cleaning up old images..."
            docker image prune -f

            echo "✓ Deploy complete."
